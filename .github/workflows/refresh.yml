name: Refresh holiday data

# Full re-collection, including the lunar dates, วันพืชมงคล and the มติ ครม. notes that only
# MyHora carries.
#
# This has NO schedule on purpose. MyHora sits behind Cloudflare, which answers 403 to
# GitHub's hosted runners while serving ordinary connections normally, so a scheduled run
# on ubuntu-latest would fail every morning. Verified 2026-08-20: myhora.com returns 403
# from a runner and 200 from a residential address; bot.or.th and Google return 200 from both.
#
# Two ways to use it:
#   - Locally, where MyHora is reachable:  npm run refresh
#   - Here, with `runner` set to a self-hosted label running on such a network.
#
# Day-to-day monitoring is handled by watch.yml, which uses only the reachable sources.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Buddhist years to collect, e.g. 2569,2570'
        required: false
      runner:
        description: 'Runner label. ubuntu-latest will be blocked by Cloudflare; use a self-hosted runner.'
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect from sources
        id: collect
        # The input reaches the shell through the environment, never by template expansion,
        # so text typed into the form cannot become a command.
        env:
          YEARS: ${{ inputs.years }}
        run: |
          args=(--body-file=pr-body.md)
          [ -n "$YEARS" ] && args+=("--years=$YEARS")
          if ! npx tsx src/cli.ts refresh "${args[@]}"
          then
            echo "::error::Collection failed. If this ran on a hosted runner, MyHora was almost" \
              "certainly blocked by Cloudflare — run 'npm run refresh' locally instead."
            exit 1
          fi

      - name: Validate what was collected
        if: steps.collect.outputs.changed == 'true'
        run: npm run validate

      - name: Ensure labels exist
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create holiday-update --color 0E8A16 --description 'Automated holiday data refresh' --force
          gh label create cabinet-change --color B60205 --description 'A วันหยุดพิเศษ (ครม.) was added or removed' --force

      - name: Open or update the pull request
        if: steps.collect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: bot/holiday-refresh
          delete-branch: true
          title: 'Holiday data update (พ.ศ. ${{ steps.collect.outputs.years }})'
          body-path: pr-body.md
          commit-message: |
            Update Thai holiday data for พ.ศ. ${{ steps.collect.outputs.years }}

            Collected from MyHora, the Bank of Thailand and Google's Thai holiday
            calendar. Review the diff against the มติ ครม. before merging.
          labels: |
            holiday-update
            ${{ steps.collect.outputs.cabinet_change == 'true' && 'cabinet-change' || '' }}
          add-paths: data/**

      - name: Report when nothing changed
        if: steps.collect.outputs.changed != 'true'
        run: echo "Sources agree with the committed data. No pull request needed."
