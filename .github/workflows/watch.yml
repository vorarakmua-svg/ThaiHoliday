name: Watch for cabinet changes

# MyHora is unreachable from GitHub's runners — Cloudflare answers 403 to datacenter
# addresses — so CI cannot rebuild a year. It can still watch: the Bank of Thailand and
# Google are both reachable, BOT announces the days ครม. grants to banks, and the
# python-holidays library is installed from PyPI. When they report a day this repository
# does not have, it opens an issue instead of guessing.
#
# Everything here runs on GitHub's free hosted runners: public data, PyPI, no secrets.
#
# Full re-collection runs where MyHora is reachable: `npm run refresh`.

on:
  schedule:
    # 08:00 ICT daily.
    - cron: '0 1 * * *'
    # 15:00 ICT Tuesday and Wednesday — ครม. meets on Tuesdays.
    - cron: '0 8 * * 2,3'
  workflow_dispatch:
    inputs:
      years:
        description: 'Buddhist years to check, e.g. 2560-2570 to audit history. Default: this year and next.'
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # python-holidays, the third witness. Free and offline once installed: pip only ever
      # fetches the exact files whose hashes are pinned in requirements-ci.txt.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install --require-hashes -r requirements-ci.txt

      # Fails when a source cannot be read, so a blind watchdog shows up as a red run instead
      # of a quiet one. Findings from the sources that did answer are still filed below.
      - name: Compare reachable sources against committed data
        id: watch
        env:
          YEARS: ${{ inputs.years }}
        run: |
          args=(--body-file=watch-report.md)
          [ -n "$YEARS" ] && args+=("--years=$YEARS")
          npx tsx src/cli.ts watch "${args[@]}"

      - name: Open or update the tracking issue
        if: ${{ !cancelled() && steps.watch.outputs.findings == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CABINET: ${{ steps.watch.outputs.cabinet }}
        run: |
          set -euo pipefail
          gh label create holiday-watch --color FBCA04 --description 'Upstream reports a holiday this repo lacks' --force
          gh label create cabinet-change --color B60205 --description 'A วันหยุดพิเศษ (ครม.) may have been granted' --force

          title="Upstream holiday data differs from this repository"
          existing=$(gh issue list --label holiday-watch --state open --limit 1 --json number --jq '.[0].number // empty')

          # Fingerprint the findings so an unchanged discrepancy is reported once, not
          # restated in a fresh comment every morning until someone acts on it.
          fingerprint="watch-fingerprint:$(sha256sum watch-report.md | cut -c1-16)"
          printf '\n<!-- %s -->\n' "$fingerprint" >> watch-report.md

          if [ -n "$existing" ]; then
            # Comment rather than opening a second issue, so a long-running discrepancy
            # does not turn into a pile of duplicates.
            reported=$(gh issue view "$existing" --json body,comments \
              --jq '[.body] + [.comments[].body] | join("\n")')
            if grep -qF "$fingerprint" <<< "$reported"; then
              echo "Issue #$existing already reports these findings."
            else
              gh issue comment "$existing" --body-file watch-report.md
              echo "Commented on existing issue #$existing"
            fi
            # An issue opened for a Google-only discrepancy must escalate once BOT reports one.
            if [ "$CABINET" = "true" ]; then
              gh issue edit "$existing" --add-label cabinet-change
            fi
          else
            labels="holiday-watch"
            [ "$CABINET" = "true" ] && labels="$labels,cabinet-change"
            gh issue create --title "$title" --body-file watch-report.md --label "$labels"
          fi

      - name: Report a quiet run
        if: steps.watch.outputs.findings != 'true'
        run: echo "Reachable sources agree with the committed data."
